name: SEO Validation

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Sitemap and Robots
        run: |
          if [ ! -f "sitemap.xml" ]; then
            echo "sitemap.xml is missing!"
            exit 1
          fi
          
          if [ ! -f "robots.txt" ]; then
            echo "robots.txt is missing!"
            exit 1
          fi
          
          echo "Checking sitemap URLs for valid format..."
          grep -E "<loc>https://.*</loc>" sitemap.xml > /dev/null || { echo "Invalid URLs in sitemap!"; exit 1; }
          
          echo "Validation complete."
