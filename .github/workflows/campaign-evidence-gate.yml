name: Campaign Evidence Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  campaign-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install web dependencies
        run: pnpm --dir apps/web install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production Next build
        run: pnpm --dir apps/web build

      - name: Deterministic campaign unit tests
        run: node --test tests/campaign-evidence.test.mjs

      - name: Campaign Playwright and Axe gate
        run: npx playwright test --project=product tests/e2e/campaign-*.spec.ts
