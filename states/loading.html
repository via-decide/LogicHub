<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analyzing repository — LogicHub.app</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  .font-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  @keyframes pulse-bar{0%,100%{opacity:.4}50%{opacity:1}}
  .pulse-bar{animation:pulse-bar 1.6s ease-in-out infinite}
</style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-200 antialiased flex flex-col">
<header class="border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
    <a href="/" class="font-mono text-sm font-bold tracking-tight text-zinc-100">LOGICHUB<span class="text-amber-500">.APP</span></a>
    <span class="font-mono text-[10px] uppercase tracking-widest text-zinc-600">UI State: Loading</span>
  </div>
</header>
<main class="flex-1 flex items-center justify-center px-4 py-24">
  <div class="w-full max-w-lg">
    <div class="flex items-center gap-3 mb-6">
      <i data-lucide="loader-2" class="h-5 w-5 text-amber-500 animate-spin"></i>
      <h1 class="text-lg font-semibold text-zinc-50">Analyzing repository locally…</h1>
    </div>
    <div class="rounded-lg border border-zinc-800 bg-[#0d0d0f] p-6 font-mono text-[13px] space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-emerald-400 flex items-center gap-2"><i data-lucide="check" class="h-3.5 w-3.5"></i> Diff captured</span>
        <span class="text-zinc-600">0.4s</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-emerald-400 flex items-center gap-2"><i data-lucide="check" class="h-3.5 w-3.5"></i> AST parsed</span>
        <span class="text-zinc-600">1.1s</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-amber-400 flex items-center gap-2 pulse-bar"><i data-lucide="loader-2" class="h-3.5 w-3.5 animate-spin"></i> Serving agent context…</span>
        <span class="text-zinc-600">—</span>
      </div>
      <div class="flex items-center justify-between opacity-30">
        <span class="text-zinc-500 flex items-center gap-2"><i data-lucide="circle" class="h-3.5 w-3.5"></i> Sign receipt</span>
        <span class="text-zinc-600">—</span>
      </div>
      <div class="h-1.5 w-full rounded-full bg-zinc-800 overflow-hidden mt-2">
        <div class="h-full w-2/3 rounded-full bg-amber-500 pulse-bar"></div>
      </div>
    </div>
    <p class="mt-4 text-center font-mono text-[11px] text-zinc-600">Nothing leaves your machine while this runs.</p>
  </div>
</main>
<footer class="border-t border-zinc-800/60 py-6 text-center font-mono text-[10px] text-zinc-600">
  &copy; 2026 Logichub Sovereign Tooling.
</footer>
<script>lucide.createIcons();</script>
</body>
</html>
